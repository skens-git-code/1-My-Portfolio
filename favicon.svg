<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Sarthak Mathapati - Portfolio Favicon</title>
  <desc>SM Developer Monogram with Cyan and Violet Neon Accents</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040714"/>
      <stop offset="55%" stop-color="#070c20"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="48%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- S Gradient: Electric Cyan to Azure -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0077fe"/>
    </linearGradient>

    <!-- M Gradient: Cyber Violet to Magenta -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Subtle Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle Tile -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Code Bracket Left < -->
  <path d="M 106 200 L 54 256 L 106 312" fill="none" stroke="#00f0ff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Code Bracket Right > -->
  <path d="M 406 200 L 458 256 L 406 312" fill="none" stroke="#ec4899" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#neonGlow)"/>

  <!-- Letter S -->
  <path d="M 232 192 C 232 165 210 148 181 148 C 151 148 130 168 130 196 C 130 225 150 238 186 250 C 226 262 246 280 246 314 C 246 348 221 364 182 364 C 144 364 124 342 124 318" 
        fill="none" stroke="url(#sGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Letter M -->
  <path d="M 272 364 L 272 156 L 324 270 L 376 156 L 376 364" 
        fill="none" stroke="url(#mGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
</svg>
