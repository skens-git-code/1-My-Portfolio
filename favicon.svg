<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18" />
      <stop offset="50%" stop-color="#04060f" />
      <stop offset="100%" stop-color="#0d142b" />
    </linearGradient>

    <!-- Neon Cyan-Violet Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#8855ff" />
    </linearGradient>

    <!-- Reverse Gradient -->
    <linearGradient id="revGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8855ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Border Glow -->
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGrad)" stroke-width="4" opacity="0.45" />

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#neonGrad)" opacity="0.16" filter="url(#subtleGlow)" />

  <!-- Central Emblem: Quantum Hexagonal Lattice & Monogram -->
  <g filter="url(#glow)">
    <!-- Outer Hexagonal Crystal Frame -->
    <polygon points="256,70 410,158 410,354 256,442 102,354 102,158" 
             fill="none" 
             stroke="url(#neonGrad)" 
             stroke-width="16" 
             stroke-linejoin="round"
             stroke-linecap="round" />

    <!-- Inner Core Prisms -->
    <polygon points="256,120 366,184 366,328 256,392 146,328 146,184" 
             fill="rgba(0, 240, 255, 0.06)" 
             stroke="url(#revGrad)" 
             stroke-width="8" 
             stroke-linejoin="round"
             opacity="0.8" />

    <!-- Code Angle Brackets & Central Nexus -->
    <!-- Left Bracket < -->
    <path d="M 210,195 L 145,256 L 210,317" 
          fill="none" 
          stroke="#00f0ff" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 302,195 L 367,256 L 302,317" 
          fill="none" 
          stroke="#8855ff" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Central S-Core Diagonal Vector -->
    <path d="M 278,185 L 234,327" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linecap="round" />

    <!-- Central Floating Energy Node -->
    <circle cx="256" cy="256" r="12" fill="#00f0ff" />
  </g>
</svg>
