<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>Sarthak Mathapati</title>
  <desc>SM monogram in a cyan and violet developer brand mark</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071421"/>
      <stop offset="1" stop-color="#090512"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#accent)" stroke-width="2"/>
  <path d="M32 9 51 20v24L32 55 13 44V20z" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity=".8"/>
  <path d="M20 25v14c0 3 2 5 5 5 3 0 5-2 5-5V25M39 44V25l5 10 5-10v19" fill="none" stroke="#f4fbff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="32" cy="9" r="2" fill="#00e5ff"/>
</svg>
